# Tema claro de la aplicacion.
#
# Streamlit no permite fijar el tema desde codigo: solo por configuracion. Sin
# este archivo los widgets nativos se dibujan con el tema por defecto y no
# combinan con el resto.
#
# Los colores son los mismos que declara `ui/tema.py`; si cambias alli, cambia
# aqui.

[theme]
base = "light"
primaryColor = "#FF5A1F"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15181D"
borderColor = "#E6E8EC"
dataframeBorderColor = "#E6E8EC"
dataframeHeaderBackgroundColor = "#F1F3F6"
baseRadius = "0.75rem"
showSidebarBorder = false
